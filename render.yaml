services:
  - type: web
    name: xau-btc-fundamental-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: DEMO_MODE
        value: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./fundamental_intel.db
      - key: SECRET_KEY
        generateValue: true
      - key: API_V1_STR
        value: /api/v1
